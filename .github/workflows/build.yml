name: Build ESP32-CAM MJPEG2SD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

          arduino-cli core install esp32:esp32@3.1.1 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install RTSP library
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "ESP32-RTSPServer"

      - name: Compile AI-Thinker ESP32-CAM
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          arduino-cli compile \
            --verbose \
            --fqbn "esp32:esp32:esp32:FlashMode=dio,FlashFreq=40,FlashSize=4M,PartitionScheme=min_spiffs,PSRAM=enabled" \
            --output-dir build \
            . 2>&1 | tee compile.log

      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32cam-build-log
          path: compile.log
          if-no-files-found: ignore

      - name: Stop if compilation failed
        if: steps.compile.outcome == 'failure'
        run: |
          echo "Compilation failed. Download esp32cam-build-log for details."
          exit 1

      - name: Prepare firmware files
        run: |
          set -e
          mkdir -p release

          echo "=== BUILD OUTPUT ==="
          find build -maxdepth 1 -type f -name "*.bin" -print

          BOOTLOADER=$(find build -maxdepth 1 -type f -name "*.bootloader.bin" | head -n 1)
          PARTITIONS=$(find build -maxdepth 1 -type f -name "*.partitions.bin" | head -n 1)
          FIRMWARE=$(find build -maxdepth 1 -type f -name "*.ino.bin" | head -n 1)

          if [ -z "$BOOTLOADER" ] || [ -z "$PARTITIONS" ] || [ -z "$FIRMWARE" ]; then
            echo "ERROR: Required firmware files were not found."
            exit 1
          fi

          cp "$BOOTLOADER" release/bootloader.bin
          cp "$PARTITIONS" release/partitions.bin
          cp "$FIRMWARE" release/firmware.bin

          echo "=== FILES FOR FLASHING ==="
          ls -lh release/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32cam-mjpeg2sd-rtsp-webdav
          path: release/